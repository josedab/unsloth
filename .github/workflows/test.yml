name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast unit tests - run on all PRs
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          pip install -e ".[huggingface]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v \
            --cov=unsloth \
            --cov-report=xml \
            --cov-report=term-missing \
            --timeout=60 \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: coverage.xml
          flags: unit-tests
          name: unit-tests-py${{ matrix.python-version }}

  # Type checking
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mypy
        run: |
          pip install mypy types-requests

      - name: Run type checking
        run: |
          mypy unsloth --ignore-missing-imports --no-error-summary || true

  # GPU tests - run on main and labeled PRs only
  integration-tests:
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-gpu-tests')
    runs-on: [self-hosted, gpu]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-timeout
          pip install -e ".[huggingface,triton]"

      - name: Run integration tests
        run: |
          pytest tests/integration -v \
            -m gpu \
            --timeout=300 \
            --cov=unsloth \
            --cov-report=xml \
            -x

      - name: Upload integration coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: integration-tests

  # E2E tests - run on main only
  e2e-tests:
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-gpu-tests')
    runs-on: [self-hosted, gpu]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install pytest pytest-timeout
          pip install -e ".[huggingface,triton]"

      - name: Run E2E tests
        run: |
          pytest tests/e2e -v \
            -m "gpu and not slow" \
            --timeout=600 \
            -x

  # All tests must pass for PR merge
  tests-complete:
    needs: [unit-tests, type-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          echo "All required tests passed"
